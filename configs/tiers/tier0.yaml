# Tier 0 shared parameters (spec §4.2, §4.4, §5.1; amendments v1.1 and v1.2). Spec frozen 2026-10-15;
# v1.2 (after G0 exp_0001) adds f_old_cosine, adapt_label_noise and the per-condition fine-tune knobs.
tier: 0
data_seed: 1234
label_noise: 0.05          # training split
adapt_label_noise: 0.05    # v1.2 B2: same 5% symmetric noise on every adaptation set
f_old_cosine: true         # v1.2 B1: Adam lr 1e-3 with cosine decay to 0
kappa: 0.5
factors: [aspect, size, color, bg, posx]   # column order of Δφ̃ and of k* (D-028); equals renderer.FACTOR_NAMES
training:
  f_old_lr: 1.0e-3
  finetune_lr: 3.0e-4
  batch_size: 256
seeds:
  init_base: 0             # f_old^(s) initialisation: torch seed = init_base + s
  order_base: 100          # f_old data order / pixel noise
  noise_base: 200
  adapt_data_base: 2000    # adaptation set sampling: 2000 + pair_id
  adapt_order_base: 3000   # fine-tune data order: 3000 + pair_id
  adapt_noise_base: 4000
  points_base: 5000        # evaluation points: 5000 + pair_id (spec §7)
  restart_base: 10000      # solver restarts: 10000 + pair_id (spec §6.1)
threads: 8
solver:                    # amendments v1.4 E1 + v1.5 F1–F2 (Tier 0: box bounds [0, 1]^5); D-024 n_workers
  R: 5
  T: 400
  lr: 0.05
  lam0: 1.0
  mu: 0.0
  sigma: 0.05
  clamp: [0.0, 1.0]
  lam_schedule: halve_every
  n_lam_steps: 8
  polish: true
  slsqp_maxiter: 100
  slsqp_ftol: 1.0e-10
  slsqp_tighten: 1.0e-4
  n_workers: 8               # 8 cores from 2026-10-15 23:01 (shared machine; the user's request)
r: 0.5412657260894775      # FROZEN: spec §6.3, exp_0008 (2 × median CE(f_new) distance, 300/300 found, validation T1 s0)
