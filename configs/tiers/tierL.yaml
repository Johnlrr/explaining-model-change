# Tier L shared parameters (spec §4.1, §6.1, §8 H4; amendments v1.4 E1, v1.5 F1–F3). Spec frozen 2026-10-15.
tier: L
dims: [5, 20]
seed_sets:                  # v1.5 F3: original set and a holdout set, each × dims
  original: [0, 1000]
  holdout: [1000, 2000]
kappa: 0.5
solver:                     # phase 1 = spec §6.1 + R1 (v1.4); phase 2 = SLSQP from z0 and every restart end (v1.5 F1)
  R: 5
  T: 400
  lr: 0.05
  lam0: 1.0
  mu: 0.0
  sigma: 0.05
  lam_schedule: halve_every # R1: halve λ every T/8 while the restart has no feasible iterate
  n_lam_steps: 8
  polish: true
  slsqp_maxiter: 100
  slsqp_ftol: 1.0e-10
  slsqp_tighten: 1.0e-4     # v1.5 F2: SLSQP targets κ' = κ + 1e-4; feasibility confirmed in float32 with κ
r: .inf                     # reading: no distance budget on Tier L (compared with the exact optimum)
restart_base: 10000         # restart noise: one stream per seed set, seed 10000 + first pair seed (reading)
tolerance: {rel_error: 1.0e-3, abs_cos: 0.999, share: 0.99}   # spec §8 H4, not relaxed (v1.4)
threads: 8
