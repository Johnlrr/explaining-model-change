# Tier L shared parameters (spec §4.1, §6.1, §8 H4; amendment v1.4 E1). Spec frozen 2026-10-15.
tier: L
dims: [5, 20]
n_pairs: 1000               # per dimension; pair seeds 0–999 (EVALUATION §6)
kappa: 0.5
solver:                     # v1.4 E1: phase 1 = spec §6.1 + R1; phase 2 = SLSQP per restart
  R: 5
  T: 400
  lr: 0.05
  lam0: 1.0
  mu: 0.0
  sigma: 0.05
  lam_schedule: halve_every # R1: halve λ every T/8 while the restart has no feasible iterate
  n_lam_steps: 8
  polish: true
  slsqp_maxiter: 100
  slsqp_ftol: 1.0e-10
  slsqp_tighten: 1.0e-6     # constraints g ≥ 1e-6 inside SLSQP (D-022 implementation reading)
r: .inf                     # reading: no distance budget on Tier L (compared with the exact optimum)
restart_base: 10000         # restart noise seed 10000 + pair_id (spec §6.1)
tolerance: {rel_error: 1.0e-3, abs_cos: 0.999, share: 0.99}   # spec §8 H4, not relaxed (v1.4)
threads: 8
