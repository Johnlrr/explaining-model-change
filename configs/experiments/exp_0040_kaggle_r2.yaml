# exp_0040 on Kaggle CPU (D-044 executor), run 2 of the H5d units [3602, 3702, 4402, 4502] (whole run on one machine; D-047).
kernel:
  id: boinhbo/dce-exp0040-r2
  title: dce exp0040 r2
  code_file: src/dce/remote/bundles/v110_tc_kaggle.py
  kernel_type: script
  language: python
  is_private: true
  enable_gpu: false
  enable_internet: true
  dataset_sources:
  - boinhbo/dce-v110-tc-inputs
  competition_sources: []
  kernel_sources: []
  model_sources: []
  immutable_kernel: true
  timeout_seconds: 21600
  wait_timeout_seconds: 22200
