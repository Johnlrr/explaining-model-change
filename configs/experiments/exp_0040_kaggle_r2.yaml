  fetch_files:
  - result.json
  - artifact_manifest.json
  - metadata.json
  - pair_3602.json
  - pair_3602.npz
  - pair_3702.json
  - pair_3702.npz
  - pair_4402.json
  - pair_4402.npz
  - pair_4502.json
  - pair_4502.npz
  kernel_source_expectations: []
  json_checks:
