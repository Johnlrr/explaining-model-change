# Infrastructure smoke (not a scientific run): offline GPU kernel (T4).
# RTX PRO 6000 is not used: the repository's RTX context needs a competition
# source this project is not permitted to attach (see docs/ENVIRONMENTS.md).
kernel:
  id: boinhbo/dce-smoke-gpu
  title: dce smoke gpu
  code_file: src/dce/remote/smoke_gpu.py
  kernel_type: script
  language: python
  is_private: true
  enable_gpu: true
  enable_internet: false
  machine_shape: NvidiaTeslaT4
  expected_hardware_contains: "T4"
  dataset_sources: []
  competition_sources: []
  kernel_sources:
    - boinhbo/dce-smoke-prep
  model_sources: []
  immutable_kernel: false
  timeout_seconds: 900
  wait_timeout_seconds: 1200
  poll_interval_seconds: 30
  parameters: {}
  required_outputs:
    - result.json
    - artifact_manifest.json
  metrics_file: result.json
  fetch_files:
    - result.json
    - artifact_manifest.json
  kernel_source_expectations: []
  json_checks:
    - path: work.processed
      op: gte
      value: 100
