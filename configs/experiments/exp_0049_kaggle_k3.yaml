  - artifact_manifest.json
  - metadata.json
  - pair_112.json
  - pair_112.npz
  - pair_115.json
  - pair_115.npz
  - pair_100.json
  - pair_100.npz
  - pair_103.json
  - pair_103.npz
  - pair_106.json
