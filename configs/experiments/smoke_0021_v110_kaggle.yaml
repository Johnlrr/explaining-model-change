# smoke_0021 — Kaggle CPU kernel for v1.10 T-C (D-044): pair 9, 2 queries (smoke_0021_v110_tc.yaml), same entry
# as the exp_0034 kernels. Checks the pinned install, the inputs hash, the outputs, and the agreement with the
# local exp_0034 pair 9 queries 0–1. Not interpreted.
kernel:
  id: boinhbo/dce-v110-tc-smoke
  title: dce v110 tc smoke
  code_file: src/dce/remote/bundles/v110_tc_kaggle.py
  kernel_type: script
  language: python
  is_private: true
  enable_gpu: false
  enable_internet: true
  dataset_sources:
  - boinhbo/dce-v110-tc-inputs
  competition_sources: []
  kernel_sources: []
  model_sources: []
  immutable_kernel: false
  timeout_seconds: 3600
  wait_timeout_seconds: 4200
  poll_interval_seconds: 60
  parameters:
    config: configs/experiments/smoke_0021_v110_tc.yaml
    pairs:
    - 9
    threads: 4
    deadline_h: 0.75
    pins:
      torch: 2.14.1+cpu
      numpy: 2.5.4
      scipy: 1.18.1
    cpu_capability: avx512
    inputs_sha256: 15c747ed0089252cb638b43396709c91dfc01bbeced18dc6f62943fe9199e312
  required_outputs:
  - result.json
  - artifact_manifest.json
  - metadata.json
  metrics_file: result.json
  fetch_files:
  - result.json
  - artifact_manifest.json
  - metadata.json
  - pair_9.json
  - pair_9.npz
  kernel_source_expectations: []
  json_checks:
  - path: work.processed
    op: gte
    value: 1
