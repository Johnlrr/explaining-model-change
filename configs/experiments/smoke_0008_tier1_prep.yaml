# smoke_0008 — Tier 1 data prep, same script as exp_0010, 200 images per official split.
kernel:
  id: boinhbo/dce-tier1-data-smoke
  title: dce-tier1-data-smoke
  code_file: src/dce/remote/tier1_prep.py
  kernel_type: script
  language: python
  is_private: true
  enable_gpu: false
  enable_internet: true
  dataset_sources: []
  competition_sources: []
  kernel_sources: []
  model_sources: []
  immutable_kernel: false
  timeout_seconds: 3600
  wait_timeout_seconds: 4200
  poll_interval_seconds: 30
  parameters: {limit: 200}
  required_outputs:            # tier1_data.npz stays remote; its hash is in artifact_manifest.json
    - result.json
    - artifact_manifest.json
  metrics_file: result.json
  fetch_files:
    - result.json
    - artifact_manifest.json
  kernel_source_expectations: []
  json_checks:
    - path: work.processed
      op: gte
      value: 400
