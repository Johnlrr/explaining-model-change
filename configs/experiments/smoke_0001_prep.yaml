# Infrastructure smoke (not a scientific run): Internet-ON preparation kernel.
# Verifies the account, the runtime packages, and the MNIST 4/9 download.
kernel:
  id: boinhbo/dce-smoke-prep
  title: dce smoke prep
  code_file: src/dce/remote/smoke_prep.py
  kernel_type: script
  language: python
  is_private: true
  enable_gpu: false
  enable_internet: true
  dataset_sources: []
  competition_sources: []
  kernel_sources: []
  model_sources: []
  immutable_kernel: false
  timeout_seconds: 900
  wait_timeout_seconds: 1200
  poll_interval_seconds: 30
  parameters: {}
  required_outputs:
    - result.json
    - artifact_manifest.json
  metrics_file: result.json
  fetch_files:
    - result.json
    - artifact_manifest.json
  kernel_source_expectations: []
  json_checks:
    - path: work.processed
      op: gte
      value: 1000
